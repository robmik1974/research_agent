[project]
name = "research-agent"
version = "0.1.0"
description = "An AI application that takes a research question, gathers evidence, and returns a sourced answer."
readme = "README.md"
authors = [
    { name = "Robert Mikolajczyk", email = "ronert1674@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aisuite==0.1.11",
    "anthropic>=2.14.0",
    "docstring-parser>=0.18.0",
    "duckdb>=2.0.1",
    "fastapi>=0.165.0",
    "jinja2>=3.1.6",
    "markdown>=3.11.4",
    "matplotlib>=3.11.2",
    "mistralai>=3.9.0",
    "openai>=3.59.0",
    "pandas>=3.1.1",
    "psycopg2-binary>=2.9.13",
    "pydantic[email]>=2.14.4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "qrcode>=8.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.1.9",
    "tabulate>=0.10.0",
    "tavily-python>=0.7.12",
    "textstat>=0.7.13",
    "tinydb>=4.9.0",
    "uvicorn>=0.54.0",
    "vertexai>=1.71.1",
    "wikipedia>=1.4.0",
]

[project.scripts]
research-agent = "research_agent:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
